services:
  app-node-1:
    build: .
    container_name: cs420g-node-1
    environment:
      - PORT=8080
      - NODE_ID=Worker-Node-Alpha
    ports:
      - "8081:8080"
    restart: unless-stopped

  app-node-2:
    build: .
    container_name: cs420g-node-2
    environment:
      - PORT=8080
      - NODE_ID=Worker-Node-Beta
    ports:
      - "8082:8080"
    restart: unless-stopped

